<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>医療統計ボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eef1ea;
  --raised:#f8f9f5;
  --ink:#14201b;
  --ink2:#47554e;
  --ink3:#7c8a82;
  --rule:#cfd6c9;
  --rule2:#a8b3a4;
  --ai:#1d5e86;
  --midori:#3b7a57;
  --bengara:#a6472c;
  --kin:#96731f;

  --display:'Zen Old Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
  --body:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  --fig:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;

  /* カード形状トークン（テーマ切替の対象） */
  --card-radius:0px;
  --card-border-w:0px;
  --card-shadow:none;
  --card-hover-shadow:0 0 #0000;
  --card-translate:0,0;
  --grid-gap:1px;
  --grid-bg:var(--rule);
}

[data-theme="pop"]{
  --paper:#fff8ee;
  --raised:#ffffff;
  --ink:#1f2430;
  --ink2:#5c5347;
  --ink3:#9c917f;
  --rule:#ffd9c9;
  --rule2:#f2b8a0;
  --ai:#ff6b5e;
  --midori:#2ec4b6;
  --bengara:#e0433a;
  --kin:#ffc84b;

  --display:'Zen Maru Gothic',sans-serif;
  --body:'Zen Maru Gothic',sans-serif;

  --card-radius:20px;
  --card-border-w:3px;
  --card-shadow:6px 6px 0 var(--ink);
  --card-hover-shadow:9px 9px 0 var(--ink);
  --card-translate:-3px,-3px;
  --grid-gap:18px;
  --grid-bg:transparent;
}

[data-theme="flat"]{
  --paper:#f4f5f7;
  --raised:#ffffff;
  --ink:#12213f;
  --ink2:#5c6373;
  --ink3:#8b93a3;
  --rule:#e1e3e8;
  --rule2:#c7cbd4;
  --ai:#2f6fed;
  --midori:#0fae8a;
  --bengara:#d1483d;
  --kin:#f2a72f;

  --display:'Noto Sans JP',sans-serif;
  --body:'Noto Sans JP',sans-serif;

  --card-radius:0px;
  --card-border-w:0px;
  --card-shadow:none;
  --card-hover-shadow:0 0 #0000;
  --card-translate:0,0;
  --grid-gap:2px;
  --grid-bg:var(--rule);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  transition:background-color .2s ease, color .2s ease;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--body);
  font-size:15px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
a{color:var(--ai)}

/* ---------- header ---------- */
header.site{padding:40px 0 0}
.masthead{display:flex;align-items:baseline;justify-content:space-between;gap:24px;flex-wrap:wrap;
  border-bottom:2px solid var(--ink);padding-bottom:14px}
.masthead h1{
  font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.14em;
  margin:0;line-height:1.2}
.masthead .sub{font-size:12px;color:var(--ink3);letter-spacing:.08em;font-family:var(--fig)}
.masthead-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}

.theme-switch{display:inline-flex;border:1px solid var(--rule2);border-radius:var(--card-radius,0);overflow:hidden}
.theme-switch button{font-family:var(--body);font-size:11.5px;padding:5px 13px;border:none;background:var(--raised);
  color:var(--ink2);cursor:pointer;letter-spacing:.03em;transition:background .15s ease,color .15s ease}
.theme-switch button + button{border-left:1px solid var(--rule2)}
.theme-switch button:hover{background:var(--rule)}
.theme-switch button.on{background:var(--ink);color:var(--raised)}

/* ---------- signature: publication timeline ---------- */
.timeline{margin:22px 0 8px;padding:18px 0 12px;border-bottom:1px solid var(--rule)}
.timeline .tl-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.tl-title{font-family:var(--display);font-size:14px;letter-spacing:.22em}
.tl-next{font-size:12px;color:var(--ink2)}
.tl-next b{font-family:var(--fig);color:var(--kin);font-weight:600}
.tl-grid{position:relative;display:grid;grid-template-columns:repeat(12,1fr);
  border-top:1px solid var(--rule2);min-height:96px}
.tl-col{border-right:1px dotted var(--rule);padding:6px 4px 10px;position:relative}
.tl-col:last-child{border-right:none}
.tl-m{font-family:var(--fig);font-size:10px;color:var(--ink3);letter-spacing:.05em;display:block;margin-bottom:6px}
.tl-mark{display:block;width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:2px 0;
  font-family:var(--body);font-size:10.5px;line-height:1.35;color:var(--ai);
  border-left:2px solid var(--ai);padding-left:5px;margin-bottom:4px}
.tl-mark:hover,.tl-mark:focus-visible{color:var(--ink);border-left-color:var(--ink);outline:none;text-decoration:underline}
.tl-mark.next{color:var(--kin);border-left-color:var(--kin);font-weight:700}
.tl-now{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--bengara);pointer-events:none}
.tl-now::after{content:'本日';position:absolute;top:-16px;left:3px;font-size:10px;font-family:var(--fig);color:var(--bengara)}

/* ---------- 指標グループ見出し ---------- */
.ind-grp{margin-bottom:0}
.ind-grp-label{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:15px;
  font-weight:700;letter-spacing:.16em;color:var(--ink);margin:38px 0 14px;padding-bottom:9px;
  border-bottom:2px solid var(--rule2)}
.ind-grp-label::before{content:'';width:14px;height:14px;flex:0 0 auto;background:var(--ink3)}
.ind-grp:first-child .ind-grp-label{margin-top:0}
.ind-grp[data-g="薬局"] .ind-grp-label::before{background:var(--midori)}
.ind-grp[data-g="認定薬局"] .ind-grp-label::before{background:var(--bengara)}
.ind-grp[data-g="人口"] .ind-grp-label::before{background:var(--ai)}
.ind-grp[data-g="社会保障"] .ind-grp-label::before{background:var(--kin)}
.ind-grp .grid{margin:0 0 10px}

/* ---------- cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:var(--grid-gap);
  background:var(--grid-bg);border:1px solid var(--grid-bg);margin:26px 0 60px;transition:background .2s ease,gap .2s ease}
.card{background:var(--raised);border:var(--card-border-w) solid var(--ink);border-radius:var(--card-radius);
  text-align:left;cursor:pointer;box-shadow:var(--card-shadow);
  padding:18px 18px 16px;display:flex;flex-direction:column;gap:2px;
  font-family:var(--body);color:inherit;
  transition:background .15s ease,box-shadow .15s ease,transform .15s ease,border-radius .2s ease}
.card:hover,.card:focus-visible{background:#fff;outline:none;box-shadow:var(--card-hover-shadow);
  transform:translate(var(--card-translate))}
.card:focus-visible{box-shadow:var(--card-hover-shadow),inset 0 0 0 2px var(--ai)}
.card .cat{font-family:var(--fig);font-size:10px;letter-spacing:.14em;color:var(--ink3);text-transform:uppercase}
.card h2{font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:.06em;margin:2px 0 10px}
.card .val{font-family:var(--fig);font-weight:600;font-size:33px;letter-spacing:-.01em;line-height:1.05;
  font-variant-numeric:tabular-nums}
.card .unit{font-family:var(--body);font-size:12px;color:var(--ink2);margin-left:4px;letter-spacing:.04em}
.card .delta{font-family:var(--fig);font-size:12px;margin-top:6px;font-variant-numeric:tabular-nums}
.up{color:var(--midori)} .down{color:var(--bengara)} .flat{color:var(--ink3)}
.card .meta{margin-top:12px;padding-top:9px;border-top:1px dotted var(--rule2);
  font-size:11px;color:var(--ink3);line-height:1.6}
.card .meta .pubdate{font-family:var(--fig)}
.pip{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--rule2);margin-right:5px;vertical-align:1px}
.pip.fresh{background:var(--midori)} .pip.due{background:var(--kin)}

/* ---------- detail ---------- */
#detail{display:none;padding-bottom:80px}
#detail.on{display:block}
.back{background:none;border:none;cursor:pointer;font-family:var(--fig);font-size:12px;
  letter-spacing:.1em;color:var(--ink2);padding:26px 0 18px}
.back:hover{color:var(--ink);text-decoration:underline}
.d-head{border-bottom:2px solid var(--ink);padding-bottom:16px}
.d-head .cat{font-family:var(--fig);font-size:10px;letter-spacing:.16em;color:var(--ink3)}
.d-head h2{font-family:var(--display);font-size:28px;letter-spacing:.1em;margin:4px 0 12px;font-weight:700}
.d-hero{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.d-hero .big{font-family:var(--fig);font-weight:600;font-size:56px;line-height:1;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
.d-hero .side{font-size:12.5px;color:var(--ink2);line-height:1.6;padding-bottom:4px}
.d-hero .side .d2{font-family:var(--fig);font-size:14px}

.panes{display:grid;grid-template-columns:1fr 300px;gap:36px;margin-top:32px;align-items:start}
@media(max-width:820px){.panes{grid-template-columns:1fr}}

.chart-box{background:var(--raised);border:1px solid var(--rule);padding:16px 12px 8px}
.chart-top{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:0 6px 10px;font-size:11px;color:var(--ink3);font-family:var(--fig);letter-spacing:.06em}
.zero-toggle{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--ink2)}
svg.chart{display:block;width:100%;height:auto;overflow:visible}
.gridline{stroke:var(--rule);stroke-width:1}
.axis-txt{font-family:var(--fig);font-size:10px;fill:var(--ink3)}
.line{fill:none;stroke:var(--ai);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.dot{fill:var(--raised);stroke:var(--ai);stroke-width:1.5}
.dot-last{fill:var(--ai);stroke:var(--raised);stroke-width:2.5}
.hover-line{stroke:var(--ink3);stroke-width:1;stroke-dasharray:2 3}

.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;padding:7px 10px;
  font-size:11.5px;line-height:1.5;white-space:nowrap;transform:translate(-50%,-125%);opacity:0;transition:opacity .1s}
.tip .tv{font-family:var(--fig);font-size:13px;font-weight:600}
.chart-wrap{position:relative}

.meta-table{width:100%;border-collapse:collapse;font-size:12.5px}
.meta-table th{text-align:left;font-weight:500;color:var(--ink3);width:88px;padding:7px 8px 7px 0;
  vertical-align:top;border-bottom:1px dotted var(--rule2);font-size:11.5px}
.meta-table td{padding:7px 0;vertical-align:top;border-bottom:1px dotted var(--rule2);color:var(--ink2)}
.meta-table td.f{font-family:var(--fig)}

h3.sec{font-family:var(--display);font-size:14px;letter-spacing:.2em;margin:44px 0 0;
  padding-bottom:8px;border-bottom:1px solid var(--rule2)}
table.series{width:100%;border-collapse:collapse;font-size:13px;margin-top:0}
table.series th{font-size:11px;color:var(--ink3);font-weight:500;letter-spacing:.08em;
  text-align:right;padding:8px 10px;border-bottom:1px solid var(--rule2)}
table.series th:first-child{text-align:left}
table.series td{padding:7px 10px;text-align:right;border-bottom:1px dotted var(--rule);
  font-family:var(--fig);font-variant-numeric:tabular-nums}
table.series td:first-child{text-align:left;font-family:var(--body)}
table.series tr:first-child td{background:#fff}
.note{font-size:11.5px;color:var(--ink3);margin-top:12px;line-height:1.7}

/* ---------- 参照データベース ---------- */
.db-sec{margin:0 0 60px}
.db-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;
  border-bottom:1px solid var(--rule2);padding-bottom:8px;margin-bottom:1px}
.db-head .t{font-family:var(--display);font-size:14px;letter-spacing:.2em}
.db-head .n{font-size:11.5px;color:var(--ink3)}
.db-card{width:100%;background:var(--raised);border:1px solid var(--rule);border-top:none;
  text-align:left;cursor:pointer;padding:20px 20px 18px;font-family:var(--body);color:inherit;
  display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;transition:background .15s ease}
.db-card:hover,.db-card:focus-visible{background:#fff;outline:none}
.db-card:focus-visible{box-shadow:inset 0 0 0 2px var(--ai)}
[data-theme="pop"] .db-card{border:var(--card-border-w) solid var(--ink);border-radius:var(--card-radius);
  box-shadow:var(--card-shadow);margin-bottom:18px;transition:box-shadow .15s ease,transform .15s ease}
[data-theme="pop"] .db-card:hover{box-shadow:var(--card-hover-shadow);transform:translate(var(--card-translate))}
.db-card h2{font-family:var(--display);font-size:19px;letter-spacing:.06em;margin:2px 0 4px;font-weight:700}
.db-card .desc{font-size:12px;color:var(--ink2);max-width:52ch;line-height:1.65}
.db-card .tag{display:inline-block;font-family:var(--fig);font-size:10px;letter-spacing:.12em;
  border:1px solid var(--rule2);color:var(--ink3);padding:1px 7px;margin-right:6px}
.db-figs{display:flex;gap:26px}
.db-fig .k{font-size:10.5px;color:var(--ink3);letter-spacing:.06em}
.db-fig .v{font-family:var(--fig);font-weight:600;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.db-fig .v small{font-size:12px;font-family:var(--body);color:var(--ink2);margin-left:3px}
.db-purpose{max-width:280px;border-left:2px solid var(--rule2);padding-left:16px}
.update-badge{display:inline-block;font-family:var(--fig);font-size:9.5px;letter-spacing:.06em;
  color:#fff;background:var(--bengara);padding:2px 8px;border-radius:2px;margin:0 0 8px}
.db-purpose .k{font-size:10.5px;color:var(--ink3);letter-spacing:.06em;margin-bottom:5px}
.db-purpose p{margin:0;font-size:11.5px;line-height:1.75;color:var(--ink2)}
@media(max-width:700px){.db-card{grid-template-columns:1fr}.db-figs{gap:20px}.db-purpose{max-width:none;border-left:none;border-top:2px solid var(--rule2);padding-left:0;padding-top:12px}}

/* ---------- 推計ビューア ---------- */
.pj-reader{background:var(--raised);border:1px solid var(--rule);padding:18px 20px 20px;margin-top:26px}
.pj-top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.pj-year{font-family:var(--fig);font-weight:600;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.pj-wareki{font-size:12.5px;color:var(--ink2)}
.pj-kind{font-family:var(--fig);font-size:10px;letter-spacing:.12em;border:1px solid var(--rule2);
  color:var(--ink3);padding:1px 7px;margin-left:auto}

.pj-hint{display:flex;align-items:center;gap:6px;font-family:var(--body);font-size:11px;
  color:var(--ai);letter-spacing:.03em;margin-bottom:8px}
.pj-hint svg{flex:0 0 auto}

.pj-slide-row{display:flex;align-items:center;gap:10px}
.pj-slide-row .edge{font-family:var(--fig);font-size:11px;color:var(--ink3);flex:0 0 auto;width:38px}
.pj-slide-row .edge.end{text-align:right}
.pj-slide-col{flex:1 1 auto;min-width:0}

input[type=range].pj-slider{width:100%;margin:0;accent-color:var(--ai);cursor:pointer}
input[type=range].pj-slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:20px;height:20px;border-radius:50%;
  background:var(--ai);border:3px solid var(--raised);box-shadow:0 0 0 1.5px var(--ai);cursor:grab}
input[type=range].pj-slider::-webkit-slider-thumb:active{cursor:grabbing}
input[type=range].pj-slider::-moz-range-thumb{
  width:20px;height:20px;border-radius:50%;background:var(--ai);
  border:3px solid var(--raised);box-shadow:0 0 0 1.5px var(--ai);cursor:grab}
input[type=range].pj-slider::-webkit-slider-runnable-track{height:4px;background:var(--rule2)}
input[type=range].pj-slider::-moz-range-track{height:4px;background:var(--rule2)}

.pj-ticks{position:relative;height:16px;margin:4px 0 16px}
.pj-ticks span{position:absolute;top:0;font-family:var(--fig);font-size:10px;color:var(--ink3);white-space:nowrap}
.pj-ticks span::before{content:'';position:absolute;top:-9px;left:50%;width:1px;height:5px;
  background:var(--rule2);transform:translateX(-50%)}
.pj-ticks span.on{color:var(--ai);font-weight:700}
.pj-ticks span.on::before{background:var(--ai);width:2px}

.pj-vals{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:1px;background:var(--rule)}
.pj-val{background:var(--raised);padding:11px 12px 12px}
.pj-val .k{font-size:10.5px;color:var(--ink3);letter-spacing:.05em;display:flex;align-items:center;gap:5px}
.pj-val .sw{width:9px;height:9px;display:inline-block;border-radius:1px}
.pj-val .v{font-family:var(--fig);font-weight:600;font-size:21px;line-height:1.25;font-variant-numeric:tabular-nums}
.pj-val .v small{font-size:11px;font-family:var(--body);color:var(--ink2);margin-left:2px}
.pj-val .d{font-family:var(--fig);font-size:10.5px;color:var(--ink3)}

.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--ink2);padding:10px 6px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:10px;display:inline-block;border-radius:1px}
.axis-r{font-family:var(--fig);font-size:10px;fill:var(--bengara)}
.rate-line{fill:none;stroke:var(--bengara);stroke-width:2}
.marker-line{stroke:var(--ink2);stroke-width:1;stroke-dasharray:3 3}
.marker-txt{font-family:var(--body);font-size:9.5px;fill:var(--ink2)}
.cursor-line{stroke:var(--ink);stroke-width:1.5}

.step-toggle{font-family:var(--fig);font-size:11px;color:var(--ink2);cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;margin-top:14px}

/* ---------- 財源別内訳（円グラフ） ---------- */
.fin-block{margin-top:16px}
.fin-top{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:10px;margin-bottom:6px}
.fin-year-now{font-family:var(--fig);font-size:12px;color:var(--ink);font-weight:600}
.fin-slider-wrap{margin:4px 0 20px}
input[type=range].fin-slider{display:block;width:100%;accent-color:var(--ai);margin:0}
.fin-ticks{display:flex;justify-content:space-between;margin-top:2px}
.fin-ticks span{font-family:var(--fig);font-size:10px;color:var(--ink3);position:relative}
.fin-ticks span::before{content:'';position:absolute;top:-6px;left:50%;width:1px;height:4px;background:var(--rule2)}
.fin-ticks span.on{color:var(--ink);font-weight:700}
.fin-ticks span.on::before{background:var(--ai);width:2px}
.year-tabs{display:flex;flex-wrap:wrap;gap:6px;row-gap:6px}
.year-tabs button{font-family:var(--fig);font-size:11px;padding:4px 11px;border:1px solid var(--rule2);
  background:var(--raised);cursor:pointer;color:var(--ink2);letter-spacing:.03em}
.year-tabs button:hover{border-color:var(--ink2)}
.year-tabs button.on{background:var(--ink);color:var(--raised);border-color:var(--ink)}
.fin-wrap{display:grid;grid-template-columns:210px 1fr;gap:30px;align-items:center;margin-top:14px;
  background:var(--raised);border:1px solid var(--rule);padding:20px}
.fin-pie-total{font-family:var(--fig);font-weight:600;font-size:16px;fill:var(--ink)}
.fin-pie-sub{font-family:var(--body);font-size:9.5px;fill:var(--ink3)}
.fin-legend{display:flex;flex-direction:column;gap:11px}
.fin-item{display:flex;align-items:center;gap:10px;font-size:12.5px}
.fin-sw{width:12px;height:12px;flex:0 0 auto}
.fin-item .lab{flex:1;color:var(--ink2)}
.fin-item .val{font-family:var(--fig);font-variant-numeric:tabular-nums;font-weight:500}
.fin-item.total{border-top:1px dotted var(--rule2);padding-top:10px;margin-top:2px;font-size:11.5px}
.fin-item.total .lab{color:var(--ink3)}
@media(max-width:700px){.fin-wrap{grid-template-columns:1fr;justify-items:center}}

/* ---------- 薬局調剤医療費（割合チャート） ---------- */
.bar{fill:var(--ai)}
.share-line{fill:none;stroke:var(--bengara);stroke-width:2}
.share-dot{fill:var(--bengara)}

/* ---------- 加算算定率マトリクス ---------- */
.matrix-scroll{overflow-x:auto;border:1px solid var(--rule);background:var(--raised)}
table.matrix{border-collapse:collapse;width:100%;min-width:760px;font-size:12px}
table.matrix th, table.matrix td{padding:8px 10px;border-bottom:1px solid var(--rule);text-align:right;
  white-space:nowrap;font-family:var(--fig);font-variant-numeric:tabular-nums}
table.matrix th{font-family:var(--body);font-size:11px;color:var(--ink2);font-weight:500;
  border-bottom:2px solid var(--ink2);letter-spacing:.02em;position:sticky;top:0;background:var(--raised)}
table.matrix td:first-child, table.matrix th:first-child{text-align:left;font-family:var(--body);
  position:sticky;left:0;background:var(--raised);min-width:190px;color:var(--ink)}
table.matrix th.total-col, table.matrix td.total-col{border-left:2px solid var(--rule2);font-weight:600}
table.matrix tr.base-row td{background:#fff;font-weight:600;color:var(--ink2);border-bottom:2px solid var(--ink2)}
table.matrix tr.base-row td:first-child{background:#fff}
table.matrix td.cell{cursor:default}
table.matrix td.dim{color:var(--ink3)}
.mx-legend{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--ink3);margin-top:10px}
.mx-scale{width:120px;height:10px;background:linear-gradient(90deg, rgba(29,94,134,.06), rgba(29,94,134,.85));
  border:1px solid var(--rule2)}

/* ---------- 医療経済実態調査（財務諸表スタイル） ---------- */
.stmt-cols{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:1px;background:var(--rule);
  border:1px solid var(--rule);margin-top:16px}
.stmt-cols .hd{background:var(--ink);color:var(--raised);padding:10px 12px;font-family:var(--body);
  font-size:12px;letter-spacing:.04em}
.stmt-cols .hd.sub{font-size:10px;color:#cfd8d2;font-weight:400;display:block;margin-top:2px}
.stmt-cols .cell{background:var(--raised);padding:9px 12px;font-family:var(--fig);font-size:12.5px;
  text-align:right;font-variant-numeric:tabular-nums}
.stmt-cols .cell.lab{text-align:left;font-family:var(--body);color:var(--ink2)}
.stmt-cols .cell.na{color:var(--ink3)}
.stmt-cols .row-total .cell{font-weight:700;background:#fff;border-top:1px solid var(--ink2)}
.stmt-cols .row-sub .cell{color:var(--ink3);font-size:11px}
.stmt-cols .row-pct .cell{background:#fff;padding-top:11px;padding-bottom:11px;border-top:1px dashed var(--rule2)}
.stmt-cols .row-pct .cell.lab{color:var(--ink);font-weight:500}
.pct-val{font-family:var(--fig);font-weight:700;font-size:18px;letter-spacing:-.01em}
.pct-val.up{color:var(--midori)}
.pct-val.down{color:var(--bengara)}
.stmt-cols .group-lab{font-family:var(--display);font-weight:700;font-size:12.5px;letter-spacing:.06em;
  color:var(--ink);padding-top:16px;border-top:2px solid var(--rule2);background:#fff}

/* ---------- 収益と給与費のバランス ---------- */
.sb-block{margin-top:14px;background:var(--raised);border:1px solid var(--rule);padding:18px 20px}
.sb-year{margin-bottom:16px}
.sb-year:last-child{margin-bottom:0}
.sb-label{font-family:var(--fig);font-size:12px;color:var(--ink2);margin-bottom:5px}
.sb-bar{position:relative;height:26px;background:#eef1ea;border:1px solid var(--rule2);overflow:hidden}
.sb-fill{position:absolute;top:0;left:0;bottom:0;background:var(--bengara);opacity:.82;
  display:flex;align-items:center;justify-content:flex-end;padding-right:6px;
  transition:width .6s ease}
.sb-fill span{font-family:var(--fig);font-size:10.5px;color:#fff;white-space:nowrap}
.sb-nums{font-family:var(--fig);font-size:11.5px;color:var(--ink2);margin-top:5px}
.sb-nums b{color:var(--ink);font-weight:700}
.sb-growth{display:flex;gap:1px;background:var(--rule);margin-top:16px;border:1px solid var(--rule)}
.sb-growth-item{flex:1;background:var(--raised);padding:12px 14px}
.sb-growth-item .k{display:block;font-size:11px;color:var(--ink3);margin-bottom:4px}
.sb-growth-item .v{font-family:var(--fig);font-weight:700;font-size:20px}
.sb-growth-item .v.up{color:var(--midori)}
.sb-growth-item .v.down{color:var(--bengara)}
.stmt-section{font-family:var(--display);font-size:13px;letter-spacing:.16em;margin:30px 0 0;
  padding-bottom:6px;border-bottom:1px solid var(--rule2)}
.stmt-yearline{font-size:11px;color:var(--ink3);margin-top:8px}

/* ---------- 施設基準届出状況（横棒リスト） ---------- */
.nt-top{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:12px;margin:14px 0 18px}
.nt-total{font-family:var(--fig);font-size:12px;color:var(--ink2)}
.nt-total b{font-size:16px;color:var(--ink);font-weight:600}
.nt-list{display:flex;flex-direction:column;gap:1px;background:var(--rule);border:1px solid var(--rule)}
.nt-row{background:var(--raised);display:grid;grid-template-columns:230px 1fr 90px;align-items:center;
  gap:14px;padding:8px 14px}
.nt-row .lab{font-size:12.5px;color:var(--ink)}
.nt-row .lab .code{font-family:var(--fig);font-size:10px;color:var(--ink3);display:block;margin-top:1px}
.nt-bar-track{height:14px;background:#eef1ea;position:relative;overflow:hidden}
.nt-bar-fill{position:absolute;top:0;left:0;bottom:0;background:var(--ai);opacity:.8;transition:width .5s ease}
.nt-row .num{font-family:var(--fig);font-size:12px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
.nt-row .num b{color:var(--ink);font-weight:600}
@media(max-width:640px){.nt-row{grid-template-columns:1fr;gap:4px}.nt-row .num{text-align:left}}

/* ---------- データ更新パネル ---------- */
.upd-panel{background:var(--raised);border:1px solid var(--rule2);padding:18px 20px;margin-top:28px}
.upd-head{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:13px;
  letter-spacing:.12em;color:var(--ink);margin-bottom:4px}
.upd-head .dot{width:7px;height:7px;border-radius:50%;background:var(--ai)}
.upd-desc{font-size:11.5px;color:var(--ink3);margin:0 0 14px;line-height:1.7}
.upd-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.upd-row select, .upd-row input[type=file]{font-family:var(--body);font-size:12px;color:var(--ink2);
  border:1px solid var(--rule2);background:var(--raised);padding:5px 9px}
.upd-row label{font-size:11.5px;color:var(--ink3);white-space:nowrap}
.upd-btn{font-family:var(--fig);font-size:11.5px;padding:6px 16px;border:1px solid var(--ink);
  background:var(--ink);color:var(--raised);cursor:pointer;letter-spacing:.03em}
.upd-btn:hover{opacity:.85}
.upd-btn:disabled{opacity:.4;cursor:not-allowed}
.upd-btn.ghost{background:var(--raised);color:var(--ink);border-color:var(--rule2)}
.upd-status{font-family:var(--fig);font-size:11.5px;margin-top:10px;padding:8px 10px;
  border-left:3px solid var(--rule2);color:var(--ink2);display:none}
.upd-status.show{display:block}
.upd-status.ok{border-left-color:var(--midori);color:var(--midori)}
.upd-status.err{border-left-color:var(--bengara);color:var(--bengara)}
.upd-status.busy{border-left-color:var(--kin);color:var(--kin)}

footer.site{border-top:1px solid var(--rule2);padding:20px 0 60px;font-size:11.5px;color:var(--ink3)}
footer.site .f{font-family:var(--fig)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function fmt(v, dec){
  if(v === null || v === undefined) return '—';
  return Number(v).toLocaleString('ja-JP', {minimumFractionDigits:dec||0, maximumFractionDigits:dec||0});
}
function wareki(y, kind){
  // 2019年 = 令和元年
  const suffix = kind === '年度' ? '年度' : '年';
  if(y >= 2019){
    const n = y - 2018;
    return '令和' + (n === 1 ? '元' : n) + suffix;
  }
  return '平成' + (y - 1988) + suffix;
}
function periodLabel(ind, y){ return y + (ind.periodKind === '年度' ? '年度' : '年'); }
function deltaClass(d){ return d > 0 ? 'up' : (d < 0 ? 'down' : 'flat'); }
function deltaText(d, dec){
  if(d === null) return '';
  const mark = d > 0 ? '△' : (d < 0 ? '▲' : '±');
  return mark + fmt(Math.abs(d), dec);
}
function latest(ind){ return ind.series[ind.series.length - 1]; }
function prev(ind){ return ind.series.length > 1 ? ind.series[ind.series.length - 2] : null; }
function freshness(ind){
  // 公表から13か月以上経っていれば「更新待ち」
  const d = new Date(ind.publishedAt);
  const months = (Date.now() - d.getTime()) / (1000*60*60*24*30.4);
  if(isNaN(months)) return {cls:'', label:''};
  if(months > 13) return {cls:'due', label:'更新待ち'};
  return {cls:'fresh', label:'最新'};
}

const GROUP_ORDER = ["薬局", "認定薬局", "人口", "社会保障"];

function cardHTML(ind){
  const [ly, lv] = latest(ind);
  const p = prev(ind);
  const d = p ? lv - p[1] : null;
  const rate = p && p[1] ? (d / p[1] * 100) : null;
  const f = freshness(ind);
  const dec = ind.decimals || 0;
  return `<button class="card" data-id="${ind.id}">
    <span class="cat">${ind.category}</span>
    <h2>${ind.name}</h2>
    <div><span class="val">${fmt(lv, dec)}</span><span class="unit">${ind.unit}</span></div>
    <div class="delta ${d===null?'flat':deltaClass(d)}">
      ${d===null ? '—' : deltaText(d, dec) + (rate!==null ? '（' + (rate>=0?'+':'−') + Math.abs(rate).toFixed(1) + '%）' : '')}
      <span style="color:var(--ink3)"> 前${ind.periodKind==='年度'?'年度':'回'}比</span>
    </div>
    <div class="meta">
      ${wareki(ly, ind.periodKind)}（${periodLabel(ind, ly)}）<br>
      <span class="pip ${f.cls}"></span><span class="pubdate">${ind.publishedAt}</span> 公表 ・ ${f.label}
    </div>
  </button>`;
}

/* ---------- 医療経済実態調査：加重平均ヘルパ ---------- */
function ikWeighted(db, field){
  const ind = db.pnl.individual, cor = db.pnl.corporate;
  const nI = ind.facilities, nC = cor.facilities, n = nI + nC;
  return db.pnl.years.map((_, i) => (ind[field][i]*nI + cor[field][i]*nC) / n);
}
function ikProfit(rev, care, cost, i){ return rev[i] + care[i] - cost[i]; }

/* ---------- 公表カレンダー ---------- */
function renderTimeline(){
  const now = new Date();
  const thisMonth = now.getMonth() + 1;
  const dayFrac = (now.getDate() - 1) / 30;

  // 次に来る公表を判定
  const upcoming = DATA.indicators
    .map(i => ({i, m: i.publishMonth}))
    .map(o => ({...o, dist: (o.m - thisMonth + 12) % 12}))
    .sort((a,b) => a.dist - b.dist)[0];

  let html = '';
  for(let m = 1; m <= 12; m++){
    const hits = DATA.indicators.filter(i => i.publishMonth === m);
    html += `<div class="tl-col"><span class="tl-m">${String(m).padStart(2,'0')}</span>` +
      hits.map(i => `<button class="tl-mark ${upcoming && upcoming.i.id===i.id ? 'next' : ''}" data-id="${i.id}">${i.name}</button>`).join('') +
      `</div>`;
  }
  const grid = $('#tlGrid');
  grid.innerHTML = html;

  const nowLine = document.createElement('div');
  nowLine.className = 'tl-now';
  nowLine.style.left = ((thisMonth - 1 + dayFrac) / 12 * 100) + '%';
  grid.appendChild(nowLine);

  grid.querySelectorAll('.tl-mark').forEach(b => {
    b.addEventListener('click', () => { location.hash = '#/' + b.dataset.id; });
  });

  if(upcoming){
    $('#nextUp').innerHTML = `次の公表予定 → <b>${upcoming.i.name}</b> ／ ${upcoming.i.nextPublish}`;
  }
}

/* ---------- 折れ線グラフ ---------- */
let zeroBase = false;

function drawChart(ind){
  const box = $('#chartWrap');
  const W = 640, H = 300;
  const pad = {t: 18, r: 18, b: 30, l: 62};
  const pts = ind.series;
  const dec = ind.decimals || 0;

  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  if(zeroBase) y0 = 0;
  const span = (y1 - y0) || 1;
  y0 -= span * 0.12; y1 += span * 0.12;
  if(zeroBase) y0 = 0;

  const sx = v => pad.l + (v - x0) / ((x1 - x0) || 1) * (W - pad.l - pad.r);
  const sy = v => H - pad.b - (v - y0) / ((y1 - y0) || 1) * (H - pad.t - pad.b);

  // y軸目盛り
  const ticks = 4;
  let g = '';
  for(let i = 0; i <= ticks; i++){
    const v = y0 + (y1 - y0) * i / ticks;
    const y = sy(v);
    g += `<line class="gridline" x1="${pad.l}" y1="${y}" x2="${W - pad.r}" y2="${y}"/>`;
    g += `<text class="axis-txt" x="${pad.l - 8}" y="${y + 3.5}" text-anchor="end">${fmt(Math.round(v * Math.pow(10,dec)) / Math.pow(10,dec), dec)}</text>`;
  }
  // x軸ラベル（端と中間）
  const labelYears = pts.length <= 8 ? xs : xs.filter((_,i) => i % Math.ceil(pts.length/6) === 0 || i === pts.length-1);
  labelYears.forEach(y => {
    g += `<text class="axis-txt" x="${sx(y)}" y="${H - pad.b + 16}" text-anchor="middle">${y}</text>`;
  });

  const path = pts.map((p,i) => (i ? 'L' : 'M') + sx(p[0]).toFixed(1) + ' ' + sy(p[1]).toFixed(1)).join(' ');
  const dots = pts.map((p,i) =>
    `<circle class="${i === pts.length-1 ? 'dot-last' : 'dot'}" cx="${sx(p[0]).toFixed(1)}" cy="${sy(p[1]).toFixed(1)}" r="${i === pts.length-1 ? 5 : 3.2}"/>`
  ).join('');

  box.innerHTML =
    `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${ind.name}の推移">
      ${g}
      <path class="line" d="${path}"/>
      ${dots}
      <line class="hover-line" id="hLine" x1="0" y1="${pad.t}" x2="0" y2="${H - pad.b}" style="opacity:0"/>
      <rect id="hitArea" x="${pad.l}" y="${pad.t}" width="${W - pad.l - pad.r}" height="${H - pad.t - pad.b}" fill="transparent"/>
    </svg>
    <div class="tip" id="tip"></div>`;

  // 線を引くアニメーション
  const line = box.querySelector('.line');
  if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    const len = line.getTotalLength();
    line.style.strokeDasharray = len;
    line.style.strokeDashoffset = len;
    line.getBoundingClientRect();
    line.style.transition = 'stroke-dashoffset .8s ease-out';
    line.style.strokeDashoffset = 0;
  }

  // ホバー
  const svg = box.querySelector('svg'), tip = $('#tip'), hLine = $('#hLine');
  function move(ev){
    const r = svg.getBoundingClientRect();
    const cx = (ev.clientX - r.left) / r.width * W;
    let best = 0, bd = Infinity;
    pts.forEach((p,i) => { const d = Math.abs(sx(p[0]) - cx); if(d < bd){ bd = d; best = i; } });
    const p = pts[best], px = sx(p[0]), py = sy(p[1]);
    const pr = best > 0 ? p[1] - pts[best-1][1] : null;
    hLine.setAttribute('x1', px); hLine.setAttribute('x2', px); hLine.style.opacity = .8;
    tip.innerHTML = `${wareki(p[0], ind.periodKind)}<br><span class="tv">${fmt(p[1], dec)}</span> ${ind.unit}` +
      (pr !== null ? `<br>前回比 ${deltaText(pr, dec)}` : '');
    tip.style.left = (px / W * r.width) + 'px';
    tip.style.top  = (py / H * r.height) + 'px';
    tip.style.opacity = 1;
  }
  svg.addEventListener('mousemove', move);
  svg.addEventListener('mouseleave', () => { tip.style.opacity = 0; hLine.style.opacity = 0; });
}

/* ---------- 財源別内訳（円グラフ） ---------- */
let finYear = null;

function renderFinancing(ind){
  const fin = ind.financing;
  const years = Object.keys(fin.years).map(Number).sort((a,b) => a - b);
  if(finYear === null || !fin.years[finYear]) finYear = years[years.length - 1];

  const y0 = years[0], y1 = years[years.length - 1];
  const slider = $('#finYearSlider');
  slider.min = y0; slider.max = y1; slider.value = finYear;

  // 年数に応じてスライダーの幅を短くする（3年なら短く、13年ならそれなりに長く）
  const px = Math.min(420, Math.max(110, years.length * 34));
  $('#finSliderWrap').style.maxWidth = px + 'px';

  renderFinTicks(years);

  slider.oninput = () => {
    let y = Number(slider.value);
    // 年に欠けがある場合は最も近い収録年に吸着させる
    if(!fin.years[y]){
      y = years.reduce((best, cur) => Math.abs(cur - y) < Math.abs(best - y) ? cur : best, years[0]);
      slider.value = y;
    }
    finYear = y;
    updateFinYearLabel(ind);
    renderFinTicks(years);
    drawPie(fin.years[finYear], finYear);
  };

  updateFinYearLabel(ind);
  drawPie(fin.years[finYear], finYear);
}

function renderFinTicks(years){
  // 年数が多いときは全年表示すると詰まりすぎるので間引く（両端は必ず表示）
  const step = years.length > 8 ? Math.ceil(years.length / 6) : 1;
  $('#finYearTicks').innerHTML = years.map((y, i) => {
    const show = i === 0 || i === years.length - 1 || i % step === 0;
    const label = show ? String(y).slice(2) : '';
    return `<span class="${y === finYear ? 'on' : ''}">${label}</span>`;
  }).join('');
}

function updateFinYearLabel(ind){
  const years = Object.keys(ind.financing.years).map(Number).sort((a,b)=>a-b);
  $('#finYearNow').textContent = `${finYear}年度　（収録年：${years[0]}〜${years[years.length-1]}年度）`;
}

function drawPie(cats, year){
  const total = cats.reduce((s,c) => s + c.value, 0);
  const cx = 100, cy = 100, r = 90;
  let angle = -90;
  let paths = '';
  cats.forEach(c => {
    const sweep = c.value / total * 360;
    const a1 = angle * Math.PI / 180, a2 = (angle + sweep) * Math.PI / 180;
    const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    const x2 = cx + r * Math.cos(a2), y2 = cy + r * Math.sin(a2);
    const large = sweep > 180 ? 1 : 0;
    paths += `<path d="M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${large} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" fill="${c.color}"/>`;
    angle += sweep;
  });

  $('#finPie').innerHTML =

function drawPharmacyChart(ind){
  const box = $('#pharmChart');
  const rows = ind.pharmacy.series;
  const W = 660, H = 300;
  const pad = {t: 20, r: 46, b: 30, l: 62};
  const y0 = rows[0][0], y1 = rows[rows.length - 1][0];
  const maxPharm = Math.max(...rows.map(r => r[2])) * 1.15;
  const maxRate = 25; // %

  const sx = y => pad.l + (y - y0) / (y1 - y0) * (W - pad.l - pad.r);
  const syBar = v => H - pad.b - v / maxPharm * (H - pad.t - pad.b);
  const syRate = p => H - pad.b - p / maxRate * (H - pad.t - pad.b);
  const barW = Math.max(10, (W - pad.l - pad.r) / rows.length * 0.55);

  let g = '';
  for(let v = 0; v <= maxPharm; v += 20000){
    const y = syBar(v);
    g += `<line class="gridline" x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}"/>`;
    g += `<text class="axis-txt" x="${pad.l-8}" y="${y+3.5}" text-anchor="end">${fmt(v)}</text>`;
  }
  [0,5,10,15,20,25].forEach(p => {
    g += `<text class="axis-r" x="${W-pad.r+8}" y="${syRate(p)+3.5}">${p}%</text>`;
  });
  rows.forEach(r => {
    g += `<text class="axis-txt" x="${sx(r[0])}" y="${H-pad.b+16}" text-anchor="middle">${r[0]}</text>`;
  });

  const bars = rows.map(r => {
    const x = sx(r[0]) - barW/2, y = syBar(r[2]);
    return `<rect class="bar" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${(H-pad.b-y).toFixed(1)}"/>`;
  }).join('');

  const linePts = rows.map(r => [sx(r[0]), syRate(r[2]/r[1]*100)]);
  const line = linePts.map((p,i) => (i?'L':'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const dots = linePts.map(p => `<circle class="share-dot" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3"/>`).join('');

  box.innerHTML =
    `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="薬局調剤医療費と国民医療費に占める割合の推移">
      ${g}${bars}
      <path class="share-line" d="${line}"/>${dots}
      <rect id="pharmHit" x="${pad.l}" y="${pad.t}" width="${W-pad.l-pad.r}" height="${H-pad.t-pad.b}" fill="transparent"/>
    </svg>
    <div class="tip" id="pharmTip"></div>`;

  const svg = box.querySelector('svg'), tip = $('#pharmTip');
  function move(ev){
    const r = svg.getBoundingClientRect();
    const cx = (ev.clientX - r.left) / r.width * W;
    let best = 0, bd = Infinity;
    rows.forEach((row,i) => { const d = Math.abs(sx(row[0]) - cx); if(d < bd){ bd = d; best = i; } });
    const row = rows[best], share = row[2] / row[1] * 100;
    const px = sx(row[0]), py = syRate(share);
    tip.innerHTML = `${wareki(row[0],'年度')}<br>薬局調剤医療費 <span class="tv">${fmt(row[2])}</span>億円<br>割合 <span class="tv">${share.toFixed(1)}%</span>`;
    tip.style.left = (px / W * r.width) + 'px';
    tip.style.top  = (py / H * r.height) + 'px';
    tip.style.opacity = 1;
  }
  svg.addEventListener('mousemove', move);
  svg.addEventListener('mouseleave', () => { tip.style.opacity = 0; });
}

function renderPjTicks(y0, y1){
  const span = y1 - y0;
  const step = span > 40 ? 10 : (span > 15 ? 5 : 1);
  const ticks = [];
  for(let y = y0; y <= y1; y += step) ticks.push(y);
  if(ticks[ticks.length - 1] !== y1) ticks.push(y1);
  $('#pjTicks').innerHTML = ticks.map(y => {
    const pct = (y - y0) / span * 100;
    const tx = y === y0 ? '0%' : (y === y1 ? '-100%' : '-50%');
    return `<span class="${y === pjYear ? 'on' : ''}" style="left:${pct}%;transform:translateX(${tx})">${y}</span>`;
  }).join('');
}

function updatePjReader(db){
  const row = db.rows.find(r => r[0] === pjYear);
  if(!row) return;
  const prev = db.rows.find(r => r[0] === pjYear - 1);
  const isActual = pjYear <= db.actualUntil;

  $('#pjYearTxt').textContent = pjYear + '年';
  $('#pjWareki').textContent = wareki(pjYear, '年');
  const kind = $('#pjKind');
  kind.textContent = isActual ? '基準人口（実績）' : '推計値';
  kind.style.color = isActual ? 'var(--ink2)' : 'var(--bengara)';
  kind.style.borderColor = isActual ? 'var(--rule2)' : 'var(--bengara)';

  const cells = [
    {k:'総数', v:row[1], sw:null, i:1},
    {k:'0～14歳', v:row[2], sw:AGE_COLORS[0], i:2},
    {k:'15～64歳', v:row[3], sw:AGE_COLORS[1], i:3},
    {k:'65歳以上', v:row[4], sw:AGE_COLORS[2], i:4}
  ].map(c => {
    const share = c.i === 1 ? null : (c.v / row[1] * 100);
    const d = prev ? c.v - prev[c.i] : null;
    return `<div class="pj-val">
      <div class="k">${c.sw ? `<span class="sw" style="background:${c.sw}"></span>` : ''}${c.k}</div>
      <div class="v">${fmt(c.v)}<small>千人</small></div>
      <div class="d">${share !== null ? '構成比 ' + share.toFixed(1) + '%　' : ''}${d !== null ? '前年 ' + deltaText(d) : ''}</div>
    </div>`;
  }).join('');

  const rate = ageRate(row);
  const prevRate = prev ? ageRate(prev) : null;
  $('#pjVals').innerHTML = cells + `<div class="pj-val" style="background:#fff">
      <div class="k" style="color:var(--bengara)">高齢化率</div>
      <div class="v" style="color:var(--bengara)">${rate.toFixed(1)}<small>%</small></div>
      <div class="d">${prevRate !== null ? '前年 ' + (rate-prevRate>=0?'+':'−') + Math.abs(rate-prevRate).toFixed(2) + 'pt' : ''}</div>
    </div>`;

  const cur = document.getElementById('pjCursor');
  if(cur) cur.setAttribute('transform', 'translate(' + cur.dataset.scale * (pjYear - db.rows[0][0]) + ',0)');
}

function drawProjection(db){
  const box = $('#pjChart');
  const rows = db.rows;
  const W = 660, H = 340;
  const pad = {t: 22, r: 46, b: 30, l: 58};
  const y0 = rows[0][0], y1 = rows[rows.length-1][0];
  const maxTotal = Math.max(...rows.map(r => r[1]));

  const sx = y => pad.l + (y - y0) / (y1 - y0) * (W - pad.l - pad.r);
  const sy = v => H - pad.b - v / (maxTotal * 1.04) * (H - pad.t - pad.b);
  const sr = p => H - pad.b - p / 50 * (H - pad.t - pad.b); // 高齢化率 0-50%

  // 左軸（人口）
  let g = '';
  for(let v = 0; v <= 120000; v += 30000){
    const y = sy(v);
    g += `<line class="gridline" x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}"/>`;
    g += `<text class="axis-txt" x="${pad.l-8}" y="${y+3.5}" text-anchor="end">${fmt(v/10)}</text>`;
  }
  g += `<text class="axis-txt" x="${pad.l-8}" y="${pad.t-8}" text-anchor="end">万人</text>`;
  // 右軸（高齢化率）
  [0,10,20,30,40,50].forEach(p => {
    g += `<text class="axis-r" x="${W-pad.r+8}" y="${sr(p)+3.5}">${p}%</text>`;
  });
  // x軸
  for(let y = y0; y <= y1; y += 10){
    g += `<text class="axis-txt" x="${sx(y)}" y="${H-pad.b+16}" text-anchor="middle">${y}</text>`;
  }

  // 積み上げ面（下から 0-14 / 15-64 / 65+）
  const bands = [[2],[2,3],[2,3,4]];
  let areas = '';
  for(let b = bands.length - 1; b >= 0; b--){
    const idxs = bands[b];
    const top = rows.map(r => sx(r[0]) + ',' + sy(idxs.reduce((s,i) => s + r[i], 0)));
    areas += `<polygon points="${sx(y0)},${sy(0)} ${top.join(' ')} ${sx(y1)},${sy(0)}" fill="${AGE_COLORS[b]}"/>`;
  }

  // 高齢化率
  const rline = rows.map((r,i) => (i?'L':'M') + sx(r[0]).toFixed(1) + ' ' + sr(ageRate(r)).toFixed(1)).join(' ');

  // 注記マーカー
  let marks = '';
  (db.markers || []).forEach((m, i) => {
    const x = sx(m.year);
    marks += `<line class="marker-line" x1="${x}" y1="${pad.t}" x2="${x}" y2="${H-pad.b}"/>`;
    marks += `<text class="marker-txt" x="${x+4}" y="${pad.t + 11 + i*13}">${m.year}　${m.label}</text>`;
  });

  const scale = (W - pad.l - pad.r) / (y1 - y0);

  box.innerHTML =
    `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${db.name} 年齢3区分別人口と高齢化率の推移">
      ${g}
      ${areas}
      ${marks}
      <path class="rate-line" d="${rline}"/>
      <g id="pjCursor" data-scale="${scale}" transform="translate(${scale*(pjYear-y0)},0)">
        <line class="cursor-line" x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${H-pad.b}"/>
      </g>
      <rect id="pjHit" x="${pad.l}" y="${pad.t}" width="${W-pad.l-pad.r}" height="${H-pad.t-pad.b}" fill="transparent" style="cursor:col-resize"/>
    </svg>`;

  // グラフ上のドラッグでも年次を選べる
  const svg = box.querySelector('svg');
  function pick(ev){
    const r = svg.getBoundingClientRect();
    const vx = (ev.clientX - r.left) / r.width * W;
    let y = Math.round(y0 + (vx - pad.l) / scale);
    y = Math.min(y1, Math.max(y0, y));
    if(y !== pjYear){ pjYear = y; $('#pjSlider').value = y; updatePjReader(db); }
  }
  let dragging = false;
  svg.addEventListener('mousedown', e => { dragging = true; pick(e); });
  window.addEventListener('mouseup', () => { dragging = false; });
  svg.addEventListener('mousemove', e => { if(dragging) pick(e); });
}

  if(frac === null || frac === undefined) return '—';

  if(p === 0) return '0%';
  if(p >= 1) return p.toFixed(2) + '%';
  if(p >= 0.01) return p.toFixed(3) + '%';
  return p.toFixed(4) + '%';
}

  const baseCells = snap.base.values.map((v,i) => `<td${i===0?' class="total-col"':''}>${fmt(v)}</td>`).join('');

  const bodyRows = snap.items.map(it => {
    const vals = it.rates;
    const compare = vals.slice(1).filter(v => v > 0); // 列間比較用（合計を除く）

    const cells = vals.map((v,i) => {
      const isTotal = i === 0;
      if(v === 0 || v === null || v === undefined){
        return `<td class="cell dim${isTotal?' total-col':''}">${fmtRate(v)}</td>`;
      }
      let style = '';
      if(!isTotal && max > 0){
        const t = v / max; // 0-1、行内の相対値
        const alpha = 0.06 + t * 0.75;
        style = ` style="background:rgba(29,94,134,${alpha.toFixed(3)})"`;
      }
      return `<td class="cell${isTotal?' total-col':''}"${style}>${fmtRate(v)}</td>`;
    }).join('');
    return `<tr><td>${it.label}</td>${cells}</tr>`;
  }).join('');

  $('#mxTable').innerHTML = `
    <thead><tr><th>算定項目</th>${headCells}</tr></thead>
    <tbody>
      <tr class="base-row"><td>${snap.base.label}</td>${baseCells}</tr>
      ${bodyRows}
    </tbody>
  `;
}

/* ---------- 経年比較（合計列） ---------- */
function groupValueForYear(db, group, year){
  const snap = db.years[year];
  const members = group.members[year];
  if(!snap || !members) return null;
  let sum = 0, found = false;
  members.forEach(label => {
    const it = snap.items.find(i => i.label === label);
    if(it && it.rates[0] !== null && it.rates[0] !== undefined){ sum += it.rates[0]; found = true; }
  });
  return found ? sum : null;
}

function drawCompareTable(db){
  const years = matrixYears(db);
  const head = `<thead><tr><th>算定項目</th>${years.map(y => `<th>${y}年</th>`).join('')}<th>直近の差</th></tr></thead>`;

  const rows = db.groups.map(g => {
    const vals = years.map(y => groupValueForYear(db, g, y));
    const cells = vals.map(v => `<td>${fmtRate(v)}</td>`).join('');
    const pts = vals.map((v,i) => v !== null ? {v, i} : null).filter(Boolean);
    let diffCell = '<td>—</td>';
    if(pts.length >= 2){
      const a = pts[pts.length-2].v, b = pts[pts.length-1].v;
      const d = (b - a) * 100;
      const cls = d > 0 ? 'up' : (d < 0 ? 'down' : 'flat');
      diffCell = `<td class="${cls}">${d>=0?'+':''}${d.toFixed(3)}pt</td>`;
    }
    const noteTxt = g.note ? `<div style="font-size:10.5px;color:var(--ink3);margin-top:2px">${g.note}</div>` : '';
    return `<tr><td>${g.label}${noteTxt}</td>${cells}${diffCell}</tr>`;
  }).join('');

  $('#mxCompareTable').innerHTML = head + `<tbody>${rows}</tbody>`;

  // 最新年のみに登場する項目（新設項目）
  const latestYear = years[years.length - 1];
  const latestSnap = db.years[latestYear];
  const knownLabels = new Set();
  db.groups.forEach(g => (g.members[latestYear] || []).forEach(l => knownLabels.add(l)));
  const newItems = latestSnap.items.filter(it => !knownLabels.has(it.label));

  if(newItems.length){
    $('#mxNewItems').innerHTML = `
      <div style="font-size:11.5px;color:var(--ink3);margin-bottom:8px">${latestYear}年に新設・再編された項目（前年との比較対象なし）</div>
      <div>${newItems.map(it => `<span class="tag" style="margin:0 6px 6px 0;display:inline-block">${it.label} ${fmtRate(it.rates[0])}</span>`).join('')}</div>
    `;
  } else {
    $('#mxNewItems').innerHTML = '';
  }
}

function fmtK(v){ return v === null || v === undefined ? '—' : fmt(Math.round(v)); }

function statementRow(label, ind, cor, all, opts){
  opts = opts || {};
  const cls = opts.total ? ' row-total' : (opts.sub ? ' row-sub' : '');
  return `<div class="row${cls}" style="display:contents">
    <div class="cell lab">${label}</div>
    <div class="cell">${ind === null ? '<span class="na">—</span>' : fmtK(ind)}</div>
    <div class="cell">${cor === null ? '<span class="na">—</span>' : fmtK(cor)}</div>
    <div class="cell">${all === null ? '<span class="na">—</span>' : fmtK(all)}</div>
  </div>`;
}

function pctCell(v){
  if(v === null || v === undefined) return '<span class="na">—</span>';
  const cls = v >= 0 ? 'up' : 'down';
  return `<span class="pct-val ${cls}">${v.toFixed(2)}%</span>`;
}

function statementRowPct(label, ind, cor, all){
  return `<div class="row row-pct" style="display:contents">
    <div class="cell lab">${label}</div>
    <div class="cell">${pctCell(ind)}</div>
    <div class="cell">${pctCell(cor)}</div>
    <div class="cell">${pctCell(all)}</div>
  </div>`;
}

function statementRow2(label, v0, v1, opts){
  opts = opts || {};
  const cls = opts.total ? ' row-total' : (opts.sub ? ' row-sub' : '');
  const d = (v0 !== null && v1 !== null) ? v1 - v0 : null;
  const dCls = d === null ? 'flat' : (d > 0 ? 'up' : (d < 0 ? 'down' : 'flat'));
  return `<div class="row${cls}" style="display:contents">
    <div class="cell lab">${label}</div>
    <div class="cell">${v0 === null ? '<span class="na">—</span>' : fmtK(v0)}</div>
    <div class="cell">${v1 === null ? '<span class="na">—</span>' : fmtK(v1)}</div>
    <div class="cell ${dCls}">${d === null ? '<span class="na">—</span>' : (d>=0?'+':'') + fmtK(d)}</div>
  </div>`;
}

function statementGroupRow(label){
  return `<div class="row group-row" style="display:contents">

}

/* ---------- Excelアップロードによる再集計 ---------- */
function ntSetStatus(msg, kind){
  const el = $('#updStatus');
  el.textContent = msg;
  el.className = 'upd-status show' + (kind ? ' ' + kind : '');
}

function handleNotificationUpload(db){
  const fileInput = $('#updFile');
  const file = fileInput.files && fileInput.files[0];
  if(!file){ ntSetStatus('先にファイルを選択してください。', 'err'); return; }

  let pref = $('#updPrefSelect').value;
  if(pref === '__new__'){
    pref = $('#updPrefNew').value.trim();
    if(!pref){ ntSetStatus('都県名を入力してください。', 'err'); return; }
  }

  if(typeof XLSX === 'undefined'){
    ntSetStatus('Excel解析ライブラリの読み込みに失敗しました。通信環境を確認してください。', 'err');
    return;
  }

  ntSetStatus('読み込み中です…（数万行あるため少し時間がかかります）', 'busy');
  $('#updRunBtn').disabled = true;

  const reader = new FileReader();
  reader.onerror = () => { ntSetStatus('ファイルの読み込みに失敗しました。', 'err'); $('#updRunBtn').disabled = false; };
  reader.onload = e => {
    try{
      const wb = XLSX.read(e.target.result, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null });

      // ヘッダー行（項番／医療機関番号／受理届出名称／受理記号 を含む行）を自動検出
      let headerIdx = -1, colFac = -1, colName = -1, colCode = -1;
      for(let i = 0; i < Math.min(rows.length, 20); i++){
        const r = rows[i] || [];
        const idxFac = r.indexOf('医療機関番号');
        const idxName = r.indexOf('受理届出名称');
        const idxCode = r.indexOf('受理記号');
        if(idxFac >= 0 && idxName >= 0 && idxCode >= 0){
          headerIdx = i; colFac = idxFac; colName = idxName; colCode = idxCode;
          break;
        }
      }
      if(headerIdx === -1){
        ntSetStatus('見出し行（医療機関番号／受理届出名称／受理記号）が見つかりませんでした。配布元と同じ形式のファイルか確認してください。', 'err');
        $('#updRunBtn').disabled = false;
        return;
      }

      const facilities = new Set();
      const codeFacilities = {};   // code -> Set of facility ids
      const codeFullname = {};

      for(let i = headerIdx + 1; i < rows.length; i++){
        const r = rows[i];
        if(!r || r[colFac] === null || r[colFac] === undefined || r[colFac] === '') continue;
        const facId = r[colFac];
        facilities.add(facId);
        const code = r[colCode];
        const name = r[colName];
        if(code){
          if(!codeFacilities[code]) codeFacilities[code] = new Set();
          codeFacilities[code].add(facId);
          codeFullname[code] = name;
        }
      }

      if(facilities.size === 0){
        ntSetStatus('薬局データを1件も読み取れませんでした。ファイルの中身を確認してください。', 'err');
        $('#updRunBtn').disabled = false;
        return;
      }

      const items = Object.keys(codeFacilities).map(code => ({
        code: code,
        name: codeFullname[code],
        count: codeFacilities[code].size
      }));

      db.prefectures[pref] = { total: facilities.size, items: items };
      ntPref = pref;

      // 都県一覧が変わった可能性があるため画面全体を再描画してからステータスを表示
      renderNotification(db);
      $('#updPrefSelect').value = pref;
      ntSetStatus(`更新しました。${pref}：総薬局数 ${facilities.size.toLocaleString('ja-JP')} 薬局／${items.length}項目。下のボタンでdata.jsonを保存できます。`, 'ok');
      $('#updDownloadBtn').style.display = '';
      $('#updDownloadBtn').onclick = () => downloadUpdatedData();
    }catch(err){
      ntSetStatus('解析中にエラーが発生しました：' + err.message, 'err');
    }finally{
      $('#updRunBtn').disabled = false;
    }
  };
  reader.readAsArrayBuffer(file);
}

function downloadUpdatedData(){
  const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'data.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---------- ルーティング ---------- */
function route(){
  const dbm = location.hash.match(/^#\/db\/(.+)$/);
  const m = location.hash.match(/^#\/(.+)$/);
  if(dbm){
    $('#summary').style.display = 'none';
    $('#detail').classList.add('on');
    const db = (DATA.databases || []).find(d => d.id === dbm[1]);
    if(db && db.type === 'matrix') renderClaimMatrix(db);
    else if(db && db.type === 'iryoukeizai') renderIryoukeizai(db);
    else if(db && db.type === 'notification') renderNotification(db);
    else renderProjection(dbm[1]);
    window.scrollTo({top: 0, behavior: 'instant'});
  }else if(m){
    $('#summary').style.display = 'none';
    $('#detail').classList.add('on');
    renderDetail(m[1]);
    window.scrollTo({top: 0, behavior: 'instant'});
  }else{
    $('#detail').classList.remove('on');
    $('#summary').style.display = '';
  }
}
window.addEventListener('hashchange', route);

/* ---------- テーマ切替 ---------- */
function applyTheme(theme){
  if(theme === 'original') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', theme);
  $('#themeSwitch').querySelectorAll('button').forEach(b => {
    b.classList.toggle('on', b.dataset.theme === theme);
  });
  try{ localStorage.setItem('dashboardTheme', theme); }catch(e){}
}

function initTheme(){
  let saved = 'original';
  try{ saved = localStorage.getItem('dashboardTheme') || 'original'; }catch(e){}
  applyTheme(saved);
  $('#themeSwitch').querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => applyTheme(b.dataset.theme));
  });
}

let UPDATE_STATUS = null;

/* ---------- 起動 ---------- */
function boot(){
  $('#stamp').textContent = 'データ生成 ' + (DATA.generatedAt || '—');
  initTheme();
  renderTimeline();
  renderCards();
  renderDbCards();
  route();
}

Promise.all([
  fetch('./data.json', {cache: 'no-store'})
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(j => { DATA = j; })
    .catch(() => { /* 初期値のまま */ }),
  fetch('./updates-status.json', {cache: 'no-store'})
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(j => { UPDATE_STATUS = j; })
    .catch(() => { /* まだ生成されていない場合は何もしない */ }),
]).finally(boot);
</script>
</body>
</html>
