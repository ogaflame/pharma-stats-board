name: Check reference database updates

on:
  schedule:
    # 毎月1日 朝（JST）に確認。データは書き換えず、事実だけをチェックします
    - cron: '30 0 1 * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run update-check script
        run: node scripts/check-updates.js

      - name: Commit and push if changed
        run: |
          git config user.name "estat-bot"
          git config user.email "actions@users.noreply.github.com"
          git add updates-status.json
          git diff --staged --quiet && echo "変更なし" || git commit -m "chore: 参照データベースの更新確認 $(date +'%Y-%m-%d')"
          git push
