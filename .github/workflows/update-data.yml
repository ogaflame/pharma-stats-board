name: Update e-Stat indicators

on:
  schedule:
    # 毎月1日 朝9時（JST）に実行 = UTC 前日 0時
    - cron: '0 0 1 * *'
  workflow_dispatch:
    # 手動実行ボタン（Actionsタブから「Run workflow」で即実行できます）

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run e-Stat update script
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        run: node scripts/update-estat.js

      - name: Commit and push if changed
        run: |
          git config user.name "estat-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet && echo "変更なし" || git commit -m "chore: e-Stat自動更新 $(date +'%Y-%m-%d')"
          git push
